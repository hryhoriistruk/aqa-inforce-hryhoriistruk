name: Python CI

on:
  push:
    branches: [main, develop, working]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: aqa-inforce-hryhoriistruk92/python/requirements.txt

      - name: Install dependencies
        working-directory: ./aqa-inforce-hryhoriistruk92/python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: flake8
        working-directory: ./aqa-inforce-hryhoriistruk92/python
        run: flake8 .

      - name: black
        working-directory: ./aqa-inforce-hryhoriistruk92/python
        run: black --check .

      - name: isort
        working-directory: ./aqa-inforce-hryhoriistruk92/python
        run: isort --check-only .

      - name: pytest
        working-directory: ./aqa-inforce-hryhoriistruk92/python
        env:
          BASE_URL: https://automationintesting.online
        run: |
          pytest \
            --html=reports/report.html \
            --self-contained-html \
            --alluredir=allure-results \
            --reruns 2 \
            --reruns-delay 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: |
            aqa-inforce-hryhoriistruk92/python/reports
            aqa-inforce-hryhoriistruk92/python/allure-results
          if-no-files-found: warn

